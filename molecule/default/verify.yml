---
- name: Verify Distribution Registry
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # Role defaults are not in scope here, but the version that Renovate bumps
    # lives in them and is what the running registry is checked against below.
    - name: Load the Distribution Registry role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: docker_registry_defaults

    - name: Read what converge.yml recorded
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: docker_registry_reports
      loop:
        - /root/pre-role-state.json
        - "{{ docker_registry_molecule_control_report_path }}"
        - /root/seed-state.json
        - "{{ docker_registry_molecule_report_path_seeded }}"
        - "{{ docker_registry_molecule_report_path_delete_disabled }}"
        - "{{ docker_registry_molecule_report_path_delete_enabled }}"

    - name: Make sense of what converge.yml recorded
      ansible.builtin.set_fact:
        docker_registry_pre_role: "{{ docker_registry_reports.results[0].content | b64decode | from_json }}"
        docker_registry_control: "{{ docker_registry_reports.results[1].content | b64decode | from_json }}"
        docker_registry_seed_state: "{{ docker_registry_reports.results[2].content | b64decode | from_json }}"
        docker_registry_seeded: "{{ docker_registry_reports.results[3].content | b64decode | from_json }}"
        docker_registry_delete_disabled: "{{ docker_registry_reports.results[4].content | b64decode | from_json }}"
        docker_registry_delete_enabled: "{{ docker_registry_reports.results[5].content | b64decode | from_json }}"

    # ---------------------------------------------------------------------
    # The baseline: none of what follows was already true
    # ---------------------------------------------------------------------

    - name: Assert nothing was serving a registry before the role ran
      ansible.builtin.assert:
        that:
          - not docker_registry_pre_role.data_path_exists
          - not docker_registry_pre_role.port_answered
        fail_msg: >-
          The host already had a registry before the role ran, so nothing below
          can be attributed to the role: {{ docker_registry_pre_role }}
        success_msg: "Neither the data path nor the registry port existed before the role ran"

    # ---------------------------------------------------------------------
    # The negative control: what the registry gives you without the role
    # ---------------------------------------------------------------------

    # The image alone is already a working registry. Saying so explicitly is
    # what keeps the assertions further down honest: only the ones that differ
    # from the control are the role's doing.
    - name: Assert the stock container image serves a registry on its own
      ansible.builtin.assert:
        that:
          - docker_registry_control.manifest_get.status == 200
          - docker_registry_control.manifest_get.digest_matches_body
          - docker_registry_control.blob_get.layer.digest_matches
        fail_msg: "The stock container image did not serve a round trip: {{ docker_registry_control }}"
        success_msg: >-
          The stock container image serves a registry unaided, so a working
          registry is not by itself evidence that the role did anything

    # The control runs on molecule/default/files/control-config.yml, which says
    # nothing about `storage.delete`, so what is measured here is the
    # registry's own compiled-in default rather than whatever the container
    # image happens to bundle. That distinction is not academic: this control
    # used to run on the image's bundled configuration file, and Docker
    # Registry v3 turned deletion on in it, which turned the control from a
    # statement about the registry into a statement about packaging - and made
    # it fail on the upgrade for a reason that had nothing to do with the role.
    - name: Assert a registry told nothing about deletion refuses it
      ansible.builtin.assert:
        that: docker_registry_control.delete.status == 405
        fail_msg: >-
          A registry whose configuration file says nothing about storage.delete
          allowed deletion ({{ docker_registry_control.delete.status }}), so the
          role's deletion assertions below prove nothing
        success_msg: >-
          A registry whose configuration file says nothing about storage.delete
          refuses deletion with 405, so a registry that accepts it can only
          have been configured to

    # ---------------------------------------------------------------------
    # The unit is up and the registry API - not merely some HTTP server - answers
    # ---------------------------------------------------------------------

    - name: Read the Distribution Registry service state
      ansible.builtin.systemd:
        name: docker-registry.service
      register: docker_registry_service

    - name: Assert the Distribution Registry service is active
      ansible.builtin.assert:
        that: docker_registry_service.status.ActiveState == 'active'
        fail_msg: "docker-registry.service is not active ({{ docker_registry_service.status.ActiveState }})"
        success_msg: "docker-registry.service is active"

    - name: Retrieve the Distribution Registry service log for debugging
      when: docker_registry_debug_service_enabled | bool
      ansible.builtin.command:
        argv:
          - journalctl
          - --no-pager
          - --output=cat
          - --unit=docker-registry.service
      changed_when: false

    # `/` answers 200 with an empty body on any registry, so hitting it proves
    # only that something is listening. `/v2/` is the API root, and the
    # `Docker-Distribution-Api-Version` header it carries is what a Docker
    # client uses to decide it is talking to a registry at all.
    - name: Query the Distribution Registry API root
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_registry_url }}/v2/"
      register: docker_registry_api_root

    - name: Assert the Distribution Registry API root identifies itself as a registry
      ansible.builtin.assert:
        that:
          - docker_registry_api_root.status == 200
          - docker_registry_api_root.docker_distribution_api_version == 'registry/2.0'
        fail_msg: "The registry API root did not identify itself: {{ docker_registry_api_root }}"
        success_msg: >-
          The registry API root answers 200 and reports
          {{ docker_registry_api_root.docker_distribution_api_version }}

    # ---------------------------------------------------------------------
    # A push/pull round trip, verified by digest
    # ---------------------------------------------------------------------

    # A content-addressed store that hands back the wrong bytes cannot pass
    # this: every digest below is recomputed from what the registry returned.
    - name: Assert the Distribution Registry served a push/pull round trip
      ansible.builtin.assert:
        that:
          - docker_registry_delete_disabled.manifest_get.status == 200
          - docker_registry_delete_disabled.manifest_get.digest_matches_body
          - docker_registry_delete_disabled.manifest_get.digest_matches_pushed
          - >-
            docker_registry_delete_disabled.manifest_get.media_type
            == 'application/vnd.docker.distribution.manifest.v2+json'
          - docker_registry_delete_disabled.blob_get.config.status == 200
          - docker_registry_delete_disabled.blob_get.config.digest_matches
          - docker_registry_delete_disabled.blob_get.layer.status == 200
          - docker_registry_delete_disabled.blob_get.layer.digest_matches
        fail_msg: "The round trip did not come back intact: {{ docker_registry_delete_disabled }}"
        success_msg: >-
          {{ docker_registry_molecule_repository }}:{{ docker_registry_molecule_tag_delete_disabled }}
          was pushed and read back with every digest matching

    - name: Query the Distribution Registry tag list
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_registry_url }}/v2/{{ docker_registry_molecule_repository }}/tags/list"
        return_content: true
      register: docker_registry_tag_list

    - name: Assert the Distribution Registry lists the pushed tag
      ansible.builtin.assert:
        that: docker_registry_molecule_tag_delete_disabled in docker_registry_tag_list.json.tags
        fail_msg: "The pushed tag is not listed: {{ docker_registry_tag_list.json }}"
        success_msg: "The registry lists {{ docker_registry_tag_list.json.tags | sort }}"

    # ---------------------------------------------------------------------
    # The blobs landed on the role's bind-mounted storage path, on the host
    # ---------------------------------------------------------------------

    # The registry answering over HTTP says nothing about *where* it put the
    # bytes. The role bind-mounts its own data path into the container, so what
    # was pushed has to be visible on the host, at the content-addressed
    # location the storage driver uses.
    - name: Stat the pushed layer blob on the Distribution Registry storage path
      ansible.builtin.stat:
        path: >-
          {{ docker_registry_data_path }}/docker/registry/v2/blobs/sha256/{{
          (docker_registry_delete_disabled.pushed.layer_digest | replace('sha256:', ''))[0:2]
          }}/{{ docker_registry_delete_disabled.pushed.layer_digest | replace('sha256:', '') }}/data
      register: docker_registry_layer_blob_on_disk

    - name: Stat the pushed tag on the Distribution Registry storage path
      ansible.builtin.stat:
        path: >-
          {{ docker_registry_data_path }}/docker/registry/v2/repositories/{{
          docker_registry_molecule_repository }}/_manifests/tags/{{
          docker_registry_molecule_tag_delete_disabled }}
      register: docker_registry_tag_on_disk

    - name: Assert what was pushed is on the host at the role's storage path
      ansible.builtin.assert:
        that:
          - docker_registry_layer_blob_on_disk.stat.exists
          - docker_registry_layer_blob_on_disk.stat.size == docker_registry_delete_disabled.pushed.layer_size
          - docker_registry_tag_on_disk.stat.exists
          - docker_registry_tag_on_disk.stat.isdir
        fail_msg: >-
          What was pushed did not land under {{ docker_registry_data_path }}
          (blob: {{ docker_registry_layer_blob_on_disk.stat.exists }},
          tag: {{ docker_registry_tag_on_disk.stat.exists }})
        success_msg: >-
          The pushed layer is on the host under {{ docker_registry_data_path }},
          {{ docker_registry_layer_blob_on_disk.stat.size }} bytes, at its own digest

    # ---------------------------------------------------------------------
    # `docker_registry_storage_delete_enabled` reaches the running process
    # ---------------------------------------------------------------------

    - name: Read the Distribution Registry environment file
      ansible.builtin.slurp:
        src: "{{ docker_registry_base_path }}/env"
      register: docker_registry_env_file

    - name: Make sense of the Distribution Registry environment file
      ansible.builtin.set_fact:
        docker_registry_env_lines: "{{ (docker_registry_env_file.content | b64decode).splitlines() }}"

    - name: Assert the configured settings reached the Distribution Registry env file
      ansible.builtin.assert:
        that:
          # The second installation pass turned deletion on; had it not, the
          # deletion below could not have succeeded.
          - "'REGISTRY_STORAGE_DELETE_ENABLED=True' in docker_registry_env_lines"
          - "'TZ=' ~ docker_registry_defaults.docker_registry_environment_variables_tz in docker_registry_env_lines"
          - "'REGISTRY_LOG_LEVEL=' ~ docker_registry_defaults.docker_registry_log_level in docker_registry_env_lines"
          # An empty value is the point: it is what keeps the debug listener closed.
          - "'REGISTRY_HTTP_DEBUG_ADDR=' ~ docker_registry_defaults.docker_registry_http_debug_addr in docker_registry_env_lines"
          - >-
            docker_registry_env_lines
            | select('search', '^REGISTRY_HTTP_HEADERS=.*nosniff')
            | list | length == 1
        fail_msg: "The configured settings did not reach the env file: {{ docker_registry_env_lines }}"
        success_msg: "The configured settings reached the env file"

    # ---------------------------------------------------------------------
    # The role's env file outranks the configuration file inside the image
    # ---------------------------------------------------------------------

    # The registry is configured by a file that lives inside the container
    # image, which the role never writes and cannot see - it only sets
    # environment variables, which the registry applies on top of that file.
    # Reading the file back out of the running container is what turns the
    # deletion assertions below from "the setting agrees with the image" into
    # "the setting overrides the image".
    #
    # It doubles as the test for docker_registry_container_config_path, which
    # is the one thing the v2 -> v3 upgrade genuinely broke: the file moved
    # from /etc/docker/registry/config.yml to /etc/distribution/config.yml.
    - name: Read the configuration file bundled inside the Distribution Registry container image
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - docker-registry
          - cat
          - "{{ docker_registry_defaults.docker_registry_container_config_path }}"
      register: docker_registry_bundled_config_raw
      changed_when: false
      failed_when: false

    - name: Assert the container image's configuration file is where the role expects it
      ansible.builtin.assert:
        that:
          - docker_registry_bundled_config_raw.rc == 0
          - "'storage' in (docker_registry_bundled_config_raw.stdout | from_yaml)"
        fail_msg: >-
          docker_registry_container_config_path points at
          {{ docker_registry_defaults.docker_registry_container_config_path }},
          which the running container image does not have a readable
          configuration file at (rc={{ docker_registry_bundled_config_raw.rc }}).
          The garbage collection command takes this path as an argument.
        success_msg: >-
          The container image bundles a registry configuration file at
          {{ docker_registry_defaults.docker_registry_container_config_path }}

    - name: Make sense of the configuration file bundled inside the Distribution Registry container image
      ansible.builtin.set_fact:
        docker_registry_bundled_delete_enabled: >-
          {{
            (docker_registry_bundled_config_raw.stdout | from_yaml).storage.delete.enabled
            | default(false) | bool
          }}

    # The env file is read when the container is created, so this is the half
    # that shows the setting actually took effect in the process. Both
    # directions are exercised: the first installation pass left deletion off
    # and the second turned it on, with nothing but the env file differing.
    - name: Assert deletion is refused when disabled and accepted when enabled
      ansible.builtin.assert:
        that:
          - docker_registry_delete_disabled.delete.status == 405
          - "'UNSUPPORTED' in docker_registry_delete_disabled.delete.body"
          - docker_registry_delete_enabled.delete.status == 202
        fail_msg: >-
          Deletion did not follow docker_registry_storage_delete_enabled
          (disabled: {{ docker_registry_delete_disabled.delete.status }},
          enabled: {{ docker_registry_delete_enabled.delete.status }})
        success_msg: >-
          Deletion is refused with 405 while docker_registry_storage_delete_enabled
          is false and accepted with 202 once it is true, while the container
          image's own configuration file says storage.delete.enabled is
          {{ docker_registry_bundled_delete_enabled }}

    - name: Query the Distribution Registry tag list after the deletion
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_registry_url }}/v2/{{ docker_registry_molecule_repository }}/tags/list"
        return_content: true
      register: docker_registry_tag_list_after

    - name: Assert the deletion removed only the tag it was aimed at
      ansible.builtin.assert:
        that:
          - docker_registry_molecule_tag_delete_enabled not in (docker_registry_tag_list_after.json.tags | default([]))
          - docker_registry_molecule_tag_delete_disabled in (docker_registry_tag_list_after.json.tags | default([]))
        fail_msg: "The deletion did not remove what it should have: {{ docker_registry_tag_list_after.json }}"
        success_msg: >-
          The deleted tag is gone and
          {{ docker_registry_molecule_tag_delete_disabled }} is untouched

    # ---------------------------------------------------------------------
    # The version that is running is the one the role asks for
    # ---------------------------------------------------------------------

    # The registry exposes no version endpoint, and its container image carries
    # no labels at all (checked against registry:2.8.3 and registry:3.0.0), so
    # neither the API nor `docker inspect` can answer this. The binary itself
    # can, and reports the real release rather than a placeholder:
    # `/bin/registry github.com/docker/distribution 2.8.3`.
    - name: Ask the running Distribution Registry which version it is
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - docker-registry
          - /bin/registry
          - --version
      register: docker_registry_running_version
      changed_when: false

    - name: Assert the running Distribution Registry is the version this role installs
      ansible.builtin.assert:
        that: "(docker_registry_running_version.stdout | trim | split(' ') | last) == docker_registry_defaults.docker_registry_version"
        fail_msg: "Distribution Registry reports {{ docker_registry_running_version.stdout | trim | split(' ') | last | default('none') }}, expected {{ docker_registry_defaults.docker_registry_version }}"
        success_msg: "Distribution Registry reports {{ docker_registry_running_version.stdout | trim | split(' ') | last }}"

    # ---------------------------------------------------------------------
    # What the previous major release wrote is still served after the upgrade
    # ---------------------------------------------------------------------

    # converge.yml installed the role at the last 2.x release first and pushed
    # an image through it, before installing the role's own version over the
    # same storage path. Everything below therefore describes an upgraded
    # registry rather than a fresh one - which is the only situation in which
    # a major version bump can go wrong for an operator.

    - name: Assert the seeding pass really ran the previous major release
      ansible.builtin.assert:
        that:
          - >-
            (docker_registry_seed_state.running_version | split(' ') | last)
            == docker_registry_molecule_seed_version
          - >-
            (docker_registry_running_version.stdout | trim | split(' ') | last)
            != docker_registry_molecule_seed_version
        fail_msg: >-
          The storage was not seeded by a different release than the one now
          running (seeded by {{ docker_registry_seed_state.running_version }},
          now running {{ docker_registry_running_version.stdout | trim }}), so
          nothing below is evidence about an upgrade
        success_msg: >-
          The storage was written by {{ docker_registry_molecule_seed_version }} and is
          now being served by
          {{ docker_registry_running_version.stdout | trim | split(' ') | last }}

    - name: Assert the previous major release's round trip succeeded at the time
      ansible.builtin.assert:
        that:
          - docker_registry_seeded.manifest_get.status == 200
          - docker_registry_seeded.manifest_get.digest_matches_pushed
        fail_msg: "The seeding round trip did not succeed: {{ docker_registry_seeded }}"
        success_msg: >-
          {{ docker_registry_molecule_seed_version }} accepted and served back
          {{ docker_registry_molecule_repository }}:{{ docker_registry_molecule_tag_seeded }}

    - name: Query the manifest that the previous major release pushed
      ansible.builtin.uri:
        url: >-
          {{ docker_registry_molecule_registry_url }}/v2/{{ docker_registry_molecule_repository
          }}/manifests/{{ docker_registry_molecule_tag_seeded }}
        headers:
          Accept: application/vnd.docker.distribution.manifest.v2+json
      register: docker_registry_seeded_manifest

    # Fetched to a file rather than into a variable, so that the bytes can be
    # re-hashed on the host: a store that hands back the wrong content after an
    # upgrade is exactly what this is looking for, and a status code would not
    # notice it.
    - name: Fetch the layer blob that the previous major release pushed
      ansible.builtin.uri:
        url: >-
          {{ docker_registry_molecule_registry_url }}/v2/{{ docker_registry_molecule_repository
          }}/blobs/{{ docker_registry_seeded.pushed.layer_digest }}
        dest: "{{ docker_registry_molecule_seeded_blob_path }}"
        mode: "0644"
      register: docker_registry_seeded_blob

    - name: Re-hash the layer blob that the previous major release pushed
      ansible.builtin.stat:
        path: "{{ docker_registry_molecule_seeded_blob_path }}"
        checksum_algorithm: sha256
      register: docker_registry_seeded_blob_stat

    - name: Assert the upgraded registry still serves what the previous major release wrote
      ansible.builtin.assert:
        that:
          - docker_registry_seeded_manifest.status == 200
          - >-
            docker_registry_seeded_manifest.docker_content_digest
            == docker_registry_seeded.pushed.manifest_digest
          - docker_registry_seeded_blob.status == 200
          - >-
            'sha256:' ~ docker_registry_seeded_blob_stat.stat.checksum
            == docker_registry_seeded.pushed.layer_digest
          - docker_registry_seeded_blob_stat.stat.size == docker_registry_seeded.pushed.layer_size
        fail_msg: >-
          The upgraded registry did not serve back what
          {{ docker_registry_molecule_seed_version }} wrote
          (manifest: {{ docker_registry_seeded_manifest.docker_content_digest | default('none') }}
          vs {{ docker_registry_seeded.pushed.manifest_digest }}, layer:
          sha256:{{ docker_registry_seeded_blob_stat.stat.checksum | default('none') }}
          vs {{ docker_registry_seeded.pushed.layer_digest }})
        success_msg: >-
          The image {{ docker_registry_molecule_seed_version }} pushed is still served by
          {{ docker_registry_running_version.stdout | trim | split(' ') | last }}, with the
          manifest digest unchanged and the layer re-hashing to
          {{ docker_registry_seeded.pushed.layer_digest }} - so the upgrade needs no data migration

    # ---------------------------------------------------------------------
    # The container is created the way the role's variables describe
    # ---------------------------------------------------------------------

    - name: Inspect the Distribution Registry container
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - docker-registry
      register: docker_registry_container_inspect
      changed_when: false

    - name: Make sense of the Distribution Registry container inspection
      ansible.builtin.set_fact:
        docker_registry_container: "{{ (docker_registry_container_inspect.stdout | from_json)[0] }}"

    - name: Assert the Distribution Registry container is created as configured
      ansible.builtin.assert:
        that:
          - docker_registry_container.HostConfig.ReadonlyRootfs
          - "'ALL' in docker_registry_container.HostConfig.CapDrop"
          - docker_registry_container.Config.User == '1000:1000'
          - >-
            docker_registry_container.Mounts
            | selectattr('Destination', 'equalto', '/var/lib/registry')
            | map(attribute='Source') | list == [docker_registry_data_path]
          - docker_registry_container_network in docker_registry_container.NetworkSettings.Networks
        fail_msg: "The container is not created as configured: {{ docker_registry_container.HostConfig }}"
        success_msg: >-
          The container is read-only, drops all capabilities, runs as
          {{ docker_registry_container.Config.User }}, and bind-mounts
          {{ docker_registry_data_path }} at /var/lib/registry

    # ---------------------------------------------------------------------
    # Nothing but the registry API is listening on the container network
    # ---------------------------------------------------------------------

    # Distribution Registry v3's bundled configuration file opens an
    # unauthenticated debug/metrics listener on :5001. The role does not
    # publish that port to the host, so the only way to tell whether it is
    # actually closed is to talk to the container's own address on the
    # container network - which is exactly where a reverse proxy or any other
    # co-located container would reach it from.
    - name: Determine the Distribution Registry container's address on its network
      ansible.builtin.set_fact:
        docker_registry_container_ip: >-
          {{ docker_registry_container.NetworkSettings.Networks[docker_registry_container_network].IPAddress }}

    - name: Probe the Distribution Registry API on the container network
      ansible.builtin.uri:
        url: "http://{{ docker_registry_container_ip }}:{{ docker_registry_defaults.docker_registry_container_http_port }}/v2/"
        timeout: 10
      register: docker_registry_probe_api
      failed_when: false

    - name: Probe the Distribution Registry debug/metrics port on the container network
      ansible.builtin.uri:
        url: "http://{{ docker_registry_container_ip }}:5001/metrics"
        timeout: 10
      register: docker_registry_probe_debug
      failed_when: false

    # The API probe is what keeps the debug probe honest: without it, "nothing
    # answered on 5001" could equally well mean the probe never reached the
    # container at all.
    - name: Assert the debug/metrics listener is closed while the API is reachable
      ansible.builtin.assert:
        that:
          - docker_registry_probe_api.status == 200
          - docker_registry_probe_debug.status == -1
        fail_msg: >-
          The debug/metrics listener on {{ docker_registry_container_ip }}:5001 answered
          {{ docker_registry_probe_debug.status }} (the API on the same address answered
          {{ docker_registry_probe_api.status }}), so docker_registry_http_debug_addr did
          not keep it closed
        success_msg: >-
          {{ docker_registry_container_ip }}:5001 refuses connections while the registry API
          on the same address answers 200, so the debug/metrics listener is closed

    - name: Assert the configured response headers reach the registry's responses
      ansible.builtin.assert:
        that: docker_registry_api_root.x_content_type_options == 'nosniff'
        fail_msg: >-
          The registry did not send X-Content-Type-Options: nosniff
          ({{ docker_registry_api_root.x_content_type_options | default('absent') }})
        success_msg: >-
          The registry sends X-Content-Type-Options: nosniff, which comes from
          docker_registry_http_headers rather than from the container image

    # ---------------------------------------------------------------------
    # Garbage collection is wired the way the role's variables describe
    # ---------------------------------------------------------------------

    - name: Stat the Distribution Registry garbage collection script
      ansible.builtin.stat:
        path: "{{ docker_registry_bin_path }}/garbage-collect"
      register: docker_registry_gc_script_stat

    - name: Read the Distribution Registry garbage collection script
      ansible.builtin.slurp:
        src: "{{ docker_registry_bin_path }}/garbage-collect"
      register: docker_registry_gc_script

    - name: Make sense of the Distribution Registry garbage collection script
      ansible.builtin.set_fact:
        docker_registry_gc_script_lines: "{{ (docker_registry_gc_script.content | b64decode).splitlines() }}"

    # An executable whose first line is not a shebang is rejected by the kernel
    # with ENOEXEC. Interactive shells paper over that by falling back to
    # /bin/sh, but systemd - the only thing that ever runs this script - does
    # not, and reports 203/EXEC instead.
    - name: Assert the Distribution Registry garbage collection script is executable and wired as configured
      ansible.builtin.assert:
        that:
          - docker_registry_gc_script_stat.stat.exists
          - docker_registry_gc_script_stat.stat.mode == '0750'
          - docker_registry_gc_script_lines[0] == '#!/bin/bash'
          - >-
            docker_registry_gc_script_lines
            | select('search', 'registry:' ~ docker_registry_defaults.docker_registry_version)
            | list | length > 0
          - >-
            docker_registry_gc_script_lines
            | select('search', 'src=' ~ docker_registry_data_path ~ ',dst=/var/lib/registry')
            | list | length > 0
          - >-
            docker_registry_gc_script_lines
            | select('search', docker_registry_defaults.docker_registry_container_config_path)
            | list | length > 0
        fail_msg: "The garbage collection script is not what it should be: {{ docker_registry_gc_script_lines }}"
        success_msg: >-
          The garbage collection script starts with a shebang and runs
          registry:{{ docker_registry_defaults.docker_registry_version }}
          against {{ docker_registry_data_path }} with
          {{ docker_registry_defaults.docker_registry_container_config_path }}

    # -----------------------------------------------------------------
    # Garbage collection does not work, and this scenario says so
    # -----------------------------------------------------------------
    #
    # Under the role's own defaults the rendered script is not valid bash and
    # so has never run. `on_exit()`'s body consists of the
    # `docker_registry_garbage_collect_stop_service_enabled` conditional
    # (false by default) and `docker_registry_garbage_collect_command_post`
    # (empty by default), which leaves `function on_exit() { }` with a
    # whitespace-only body - a syntax error, and bash exits 2 without running
    # any of the script. Before that it was an ENOEXEC (a Jinja comment above
    # the shebang), fixed in 2026-08. So no MASH installation has ever
    # collected garbage, even though mash-playbook does enable the timer.
    #
    # That is being left alone on purpose rather than repaired. Repairing it
    # would make the first collection any operator has ever had a *v3*
    # collection, over however many years of accumulated data, and v3's
    # collector removes classes of files 2.8.3's never touched (dangling
    # per-repository `_layers` links, and marking that recurses through
    # manifest lists). Leaving it broken is what keeps the deletion risk at
    # zero.
    #
    # This assertion therefore pins the broken state rather than the working
    # one. It is deliberately the opposite of what you would normally write,
    # and it is here so that the state is recorded in something that runs
    # rather than only in a comment: whoever repairs `on_exit()` has to delete
    # this task, at which point they own the decision to let collection start
    # running.
    #
    # Note the scope: this holds *under the role's defaults*. Setting either
    # `docker_registry_garbage_collect_stop_service_enabled` or
    # `docker_registry_garbage_collect_command_post` gives `on_exit()` a real
    # body, and collection then runs on schedule.
    - name: Check whether the Distribution Registry garbage collection script is valid bash
      ansible.builtin.command:
        argv:
          - bash
          - -n
          - "{{ docker_registry_bin_path }}/garbage-collect"
      register: docker_registry_gc_script_syntax
      changed_when: false
      failed_when: false

    - name: Assert the Distribution Registry garbage collection script is known non-functional
      ansible.builtin.assert:
        that:
          - docker_registry_gc_script_syntax.rc != 0
          - "'syntax error' in docker_registry_gc_script_syntax.stderr"
        fail_msg: >-
          The garbage collection script now passes `bash -n`, so garbage
          collection would run on schedule. That is a deliberate decision
          rather than an accident: see the comment above this task, decide
          whether collection should start running, and if so replace this
          assertion with one that exercises a collection.
        success_msg: >-
          The garbage collection script is not valid bash under the role's
          defaults and so never runs, which is the known and deliberate state

    - name: Determine the Distribution Registry garbage collection unit paths
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=FragmentPath
          - --value
          - "docker-registry-garbage-collect.{{ item }}"
      register: docker_registry_gc_unit_paths
      changed_when: false
      loop:
        - service
        - timer

    - name: Read the Distribution Registry garbage collection units
      ansible.builtin.slurp:
        src: "{{ item.stdout | trim }}"
      register: docker_registry_gc_units
      loop: "{{ docker_registry_gc_unit_paths.results }}"
      loop_control:
        label: "{{ item.stdout | trim }}"

    - name: Make sense of the Distribution Registry garbage collection units
      ansible.builtin.set_fact:
        docker_registry_gc_service_lines: "{{ (docker_registry_gc_units.results[0].content | b64decode).splitlines() }}"
        docker_registry_gc_timer_lines: "{{ (docker_registry_gc_units.results[1].content | b64decode).splitlines() }}"

    - name: Assert the Distribution Registry garbage collection units are wired as configured
      ansible.builtin.assert:
        that:
          # A one-shot, so that a collection is something that completes rather
          # than something that stays up.
          - "'Type=oneshot' in docker_registry_gc_service_lines"
          - "'ExecStart=' ~ docker_registry_bin_path ~ '/garbage-collect' in docker_registry_gc_service_lines"
          - "'Unit=docker-registry-garbage-collect.service' in docker_registry_gc_timer_lines"
          - "'OnCalendar=' ~ docker_registry_garbage_collect_schedule in docker_registry_gc_timer_lines"
        fail_msg: >-
          The garbage collection units are not wired as configured:
          {{ docker_registry_gc_service_lines }} / {{ docker_registry_gc_timer_lines }}
        success_msg: >-
          docker-registry-garbage-collect.timer runs
          docker-registry-garbage-collect.service on
          {{ docker_registry_garbage_collect_schedule }}, which runs the
          garbage collection script

    - name: Show the Distribution Registry verification summary
      ansible.builtin.debug:
        msg:
          - "Service: {{ docker_registry_service.status.ActiveState }}"
          - "API root: {{ docker_registry_api_root.status }} ({{ docker_registry_api_root.docker_distribution_api_version }})"
          - "Running version: {{ docker_registry_running_version.stdout | trim }}"
          - >-
            Upgrade: storage seeded by {{ docker_registry_seed_state.running_version }};
            its layer re-hashes to sha256:{{ docker_registry_seeded_blob_stat.stat.checksum }}
            under the running release
          - "Round trip: manifest {{ docker_registry_delete_disabled.manifest_get.digest_header }}"
          - "Layer on host: {{ docker_registry_layer_blob_on_disk.stat.size }} bytes under {{ docker_registry_data_path }}"
          - >-
            Deletion: {{ docker_registry_delete_disabled.delete.status }} when disabled,
            {{ docker_registry_delete_enabled.delete.status }} when enabled
            (control: {{ docker_registry_control.delete.status }}; the container image's own
            configuration file says storage.delete.enabled={{ docker_registry_bundled_delete_enabled }})
          - >-
            Debug/metrics port: {{ docker_registry_probe_debug.status }} on
            {{ docker_registry_container_ip }}:5001 while the API answers
            {{ docker_registry_probe_api.status }} on the same address
          - "Tags now: {{ docker_registry_tag_list_after.json.tags | default([]) | sort }}"
          - >-
            GC script: {{ docker_registry_gc_script_lines[0] }}
            ({{ docker_registry_gc_script_stat.stat.mode }}), `bash -n` exits
            {{ docker_registry_gc_script_syntax.rc }} - known non-functional on purpose
