---
# Project source code URL: https://github.com/distribution/distribution/

docker_registry_enabled: false

docker_registry_identifier: container-registry
docker_registry_base_path: "/registry"
docker_registry_data_path: "{{ docker_registry_base_path }}/data"
docker_registry_bin_path: "{{ docker_registry_base_path }}/bin"

# renovate: datasource=docker depName=registry versioning=semver
docker_registry_version: 3.1.1

# Path of the configuration file which the container image bundles.
#
# The registry service itself does not need this value - the container image's own `CMD`
# already points at it - but `registry garbage-collect` takes the configuration file as a
# positional argument, so `../templates/bin/garbage-collect.j2` has to spell the path out.
#
# Docker Registry v3's container image moved this file from `/etc/docker/registry/config.yml`
# to `/etc/distribution/config.yml`. If you pin `docker_registry_version` back to a 2.x
# release, set this back to `/etc/docker/registry/config.yml` as well.
docker_registry_container_config_path: /etc/distribution/config.yml

docker_registry_uid: ""
docker_registry_gid: ""

# The hostname at which Container Registry is served.
docker_registry_hostname: ""

# Intentionally leaving this blank, instead of defaulting it to `docker_registry_hostname`, to avoid specifying a hostname
# which could render other services on that hostname potentially unreachable.
# See: https://github.com/mother-of-all-self-hosting/mash-playbook/issues/391
docker_registry_container_hostname: ""

docker_registry_container_image: "{{ docker_registry_container_image_registry_prefix }}registry:{{ docker_registry_container_image_tag }}"
docker_registry_container_image_tag: "{{ docker_registry_version }}"
docker_registry_container_image_registry_prefix: "{{ docker_registry_container_image_registry_prefix_upstream }}"
docker_registry_container_image_registry_prefix_upstream: "{{ docker_registry_container_image_registry_prefix_upstream_default }}"
docker_registry_container_image_registry_prefix_upstream_default: docker.io/

docker_registry_container_image_self_build: false
docker_registry_container_image_self_build_name: "distribution/distribution:{{ docker_registry_container_image_self_build_repo_version }}"
docker_registry_container_image_self_build_repo: "https://github.com/distribution/distribution.git"
docker_registry_container_image_self_build_repo_version: "{{ 'v' + docker_registry_version if docker_registry_version != 'latest' else 'main' }}"
docker_registry_container_image_self_build_src_files_path: "{{ docker_registry_base_path }}/docker-src"
docker_registry_container_image_self_build_environment_buildplatform: linux/amd64

# The base container network. It will be auto-created by this role if it doesn't exist already.
docker_registry_container_network: "{{ docker_registry_identifier }}"

# Control if the container network is deleted on uninstalling.
docker_registry_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `docker_registry_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
docker_registry_container_http_host_bind_port: ""

# The port number in the container
docker_registry_container_http_port: 5000

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
docker_registry_container_additional_networks: "{{ docker_registry_container_additional_networks_auto + docker_registry_container_additional_networks_custom }}"
docker_registry_container_additional_networks_auto: []
docker_registry_container_additional_networks_custom: []

# docker_registry_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `docker_registry_container_labels_additional_labels_custom`.
docker_registry_container_labels_traefik_enabled: true
docker_registry_container_labels_traefik_docker_network: ""
docker_registry_container_labels_traefik_rule_public: "Host(`{{ docker_registry_hostname }}`) && (Method(`GET`) || Method(`HEAD`))"
docker_registry_container_labels_traefik_rule_private: "Host(`{{ docker_registry_hostname }}`) && (Method(`POST`) || Method(`PUT`) || Method(`DELETE`) || Method(`PATCH`))"
docker_registry_container_labels_traefik_entrypoints: web-secure
docker_registry_container_labels_traefik_tls: "{{ docker_registry_container_labels_traefik_entrypoints != 'web' }}"
docker_registry_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# docker_registry_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `docker_registry_container_labels_additional_labels_custom`
#
# Example:
# docker_registry_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
docker_registry_container_labels_additional_labels: "{{ docker_registry_container_labels_additional_labels_auto + docker_registry_container_labels_additional_labels_custom }}"
docker_registry_container_labels_additional_labels_auto: []
docker_registry_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume
docker_registry_container_tmpfs_tmp_size: 512m

# Specify the size of the container's tmpfs volume
docker_registry_garbage_collect_tmpfs_run_size: 512m

# A list of extra arguments to pass to the container (`docker create` command)
docker_registry_container_extra_arguments: "{{ docker_registry_container_extra_arguments_auto + docker_registry_container_extra_arguments_custom }}"
docker_registry_container_extra_arguments_auto: []
docker_registry_container_extra_arguments_custom: []

# List of systemd services that the Container Registry systemd service depends on
docker_registry_systemd_required_services_list: "{{ docker_registry_systemd_required_services_list_default + docker_registry_systemd_required_services_list_auto + docker_registry_systemd_required_services_list_custom }}"
docker_registry_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
docker_registry_systemd_required_services_list_auto: []
docker_registry_systemd_required_services_list_custom: []

# List of systemd services that the Container Registry systemd service wants
docker_registry_systemd_wanted_services_list: "{{ docker_registry_systemd_wanted_services_list_default + docker_registry_systemd_wanted_services_list_auto + docker_registry_systemd_wanted_services_list_custom }}"
docker_registry_systemd_wanted_services_list_default: []
docker_registry_systemd_wanted_services_list_auto: []
docker_registry_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
docker_registry_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
docker_registry_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
docker_registry_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
docker_registry_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ docker_registry_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ docker_registry_container_stop_grace_time_seconds }} {{ docker_registry_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ docker_registry_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ docker_registry_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ docker_registry_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ docker_registry_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ docker_registry_identifier }} after {{ docker_registry_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
docker_registry_environment_variables_tz: UTC

# docker_registry_private_services_whitelisted_ip_ranges contains a list of whitelisted IP ranges
# which can access private services (pushing new images, deleting images, etc.)
docker_registry_private_services_whitelisted_ip_ranges: []

# docker_registry_storage_delete_enabled enables the deletion of image blobs and manifests by digest.
# Controls `REGISTRY_STORAGE_DELETE_ENABLED`
# See: https://distribution.github.io/distribution/about/configuration/#delete
#
# Note that the v3 container image's own bundled configuration file turns deletion *on*
# (the 2.8.3 one said nothing about it, leaving the registry's own `false` default in place).
# This variable is passed as an environment variable, and environment variables outrank the
# configuration file, so a `false` here still results in the registry refusing deletion with
# `405 UNSUPPORTED` - but do not remove it expecting the image to be safe by itself.
docker_registry_storage_delete_enabled: false

# docker_registry_log_level controls how verbosely the registry logs.
# Controls `REGISTRY_LOG_LEVEL`. One of: error, warn, info, debug.
#
# The v3 container image's bundled configuration file sets this to `debug`, while the 2.8.3
# one left the registry's own `info` default alone. The container's output ends up in the
# systemd journal, so `debug` means a log line per request plus internals, permanently.
# Set to an empty value to leave whatever the container image's configuration file says alone.
docker_registry_log_level: info

# docker_registry_http_debug_addr controls the address of the debug/metrics HTTP listener.
# Controls `REGISTRY_HTTP_DEBUG_ADDR`. An empty value (the default) keeps it closed.
#
# The v3 container image's bundled configuration file opens an unauthenticated listener on
# `:5001` serving Prometheus metrics and Go pprof endpoints; the 2.8.3 one did not. This role
# does not publish that port to the host, but every other container on
# `docker_registry_container_network` and on `docker_registry_container_additional_networks`
# (which typically includes the reverse proxy's network) can reach it.
#
# Set to e.g. `:5001` to opt back in, and note that doing so exposes it to those networks.
docker_registry_http_debug_addr: ""

# docker_registry_http_headers contains response headers added to every registry response.
# Controls `REGISTRY_HTTP_HEADERS` (rendered as JSON). Values are lists, as the registry
# expects. Set to an empty value to leave the container image's own headers alone.
#
# The 2.8.3 container image's bundled configuration file set `X-Content-Type-Options: nosniff`;
# the v3 one does not. Keeping it here keeps the header on regardless of the image.
docker_registry_http_headers:
  X-Content-Type-Options:
    - nosniff

# docker_registry_garbage_collect_schedule contains a systemd OnCalendar definition which controls how often `registry-gargage-collect.timer` runs
docker_registry_garbage_collect_schedule: 'Sunday *-*-* 08:30:00'

# docker_registry_garbage_collect_dry_run controls if --dry-run=true is passed to the garbage collection command
docker_registry_garbage_collect_dry_run: false

# docker_registry_garbage_collect_stop_service_enabled controls if the Registry service will be stopped while garbage collection is being done.
# For smaller registries, this may be the safer thing to do.
# For larger ones, fully stopping the registry can cause too much downtime.
docker_registry_garbage_collect_stop_service_enabled: false

# Command to run at the start of garbage collection
docker_registry_garbage_collect_command_pre: ""

# Command to run at the end of garbage collection
docker_registry_garbage_collect_command_post: ""

# docker_registry_environment_variables_additional_variables contains a multiline string with additional environment variables to pass to the container.
#
# Example:
# docker_registry_environment_variables_additional_variables: |
#   VAR=1
#   ANOTHER=value
docker_registry_environment_variables_additional_variables: ""

# docker_registry_restart_necessary controls whether the Container Registry systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
docker_registry_restart_necessary: false
