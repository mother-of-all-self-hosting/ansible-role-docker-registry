---
# Everything that needs the supporting roles' variables in scope lives in this
# one play, because `public: true` exposes them to the rest of the play only.
- name: Install and exercise Distribution Registry for Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include supporting roles for Distribution Registry Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
      loop_control:
        loop_var: role_name

    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: docker_registry_defaults

    - name: Ensure the Distribution Registry round trip script is present
      ansible.builtin.copy:
        src: roundtrip-registry.py
        dest: /var/tmp/roundtrip-registry.py
        mode: "0755"

    - name: Ensure the standalone Distribution Registry control configuration file is present
      ansible.builtin.copy:
        src: control-config.yml
        dest: "{{ docker_registry_molecule_control_config_path }}"
        mode: "0644"

    # -----------------------------------------------------------------
    # What the host looked like before the role touched it
    # -----------------------------------------------------------------

    # Recorded rather than asserted here, so that every assertion lives in
    # verify.yml. Without this, an assertion that the role's port answers and
    # its data path holds blobs could just as well be describing something that
    # was already there.
    - name: Stat the Distribution Registry data path before the role runs
      ansible.builtin.stat:
        path: "{{ docker_registry_data_path }}"
      register: docker_registry_molecule_data_path_before

    - name: Determine whether anything answers on the Distribution Registry port before the role runs
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_registry_url }}/v2/"
      register: docker_registry_molecule_port_before
      failed_when: false

    - name: Record what the host looked like before the role ran
      ansible.builtin.copy:
        dest: /root/pre-role-state.json
        mode: "0644"
        content: |
          {{
            {
              'data_path_exists': docker_registry_molecule_data_path_before.stat.exists,
              'port_answered': (docker_registry_molecule_port_before.status | default(-1)) == 200,
            } | to_nice_json
          }}

    # -----------------------------------------------------------------
    # Negative control: the stock image, with no role involvement at all
    # -----------------------------------------------------------------

    # The image on its own is a working registry, so a test that only checks
    # "a registry answers" would pass without the role having done anything.
    # Running the stock image here, with no role involvement, pins down what
    # the registry gives you for free - and therefore what verify.yml may
    # credit the role with.
    #
    # The control is deliberately handed an explicit minimal configuration file
    # (files/control-config.yml) rather than left on the one the container image
    # bundles. The bundled file is a property of how the image is packaged, not
    # of the registry, and it is not stable across releases: 2.8.3's said
    # nothing about `storage.delete` while v3's turns deletion on. A control
    # resting on it was therefore measuring packaging, and flipped from "the
    # image refuses deletion" to "the image allows deletion" on the upgrade.
    # The explicit file says nothing about `storage.delete` either, so what the
    # control pins down is the registry's own compiled-in default - measured at
    # 405 on both 2.8.3 and 3.1.1.
    #
    # Started via the Docker CLI rather than community.docker.docker_container,
    # because the ansible-lint environment used by pre-commit does not have the
    # community.docker collection and would fail the playbook syntax check.
    - name: Ensure the stock Distribution Registry container image is pulled
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "docker.io/registry:{{ docker_registry_defaults.docker_registry_version }}"
      changed_when: true

    - name: Ensure the standalone Distribution Registry control container is running
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - "{{ docker_registry_molecule_control_container_name }}"
          - -p
          - "127.0.0.1:5099:5000"
          - -v
          - "{{ docker_registry_molecule_control_config_path }}:/etc/mash-molecule-control/config.yml:ro"
          - "docker.io/registry:{{ docker_registry_defaults.docker_registry_version }}"
          # The image's entrypoint turns a `*.yml` argument into
          # `registry serve <that file>`, so this is what replaces the bundled
          # configuration file rather than merely adding to it.
          - /etc/mash-molecule-control/config.yml
      changed_when: true

    - name: Wait for the standalone Distribution Registry control container to answer (up to 60s)
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_control_url }}/v2/"
      register: docker_registry_molecule_control_ping
      until: docker_registry_molecule_control_ping is not failed
      retries: 12
      delay: 5

    - name: Run a round trip against the standalone Distribution Registry control container
      ansible.builtin.command:
        argv:
          - python3
          - /var/tmp/roundtrip-registry.py
          - "{{ docker_registry_molecule_control_url }}"
          - "{{ docker_registry_molecule_repository }}"
          - control
      register: docker_registry_molecule_control_roundtrip
      changed_when: true

    - name: Record the standalone Distribution Registry control round trip
      ansible.builtin.copy:
        dest: "{{ docker_registry_molecule_control_report_path }}"
        content: "{{ docker_registry_molecule_control_roundtrip.stdout }}"
        mode: "0644"

    # -----------------------------------------------------------------
    # Seeding pass: the previous major release, so an upgrade is exercised
    # -----------------------------------------------------------------

    # A fresh install cannot see the only question an operator with an existing
    # registry has about a major version bump: whether the new release can
    # still read what the old one wrote. So the role is installed once at the
    # last release of the previous major version, an image is pushed through
    # it, and every pass below then runs over that same storage path.
    #
    # Not public, so the overrides stay scoped to this include.
    - name: Include the Distribution Registry role at the previous major release
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        docker_registry_version: "{{ docker_registry_molecule_seed_version }}"
        docker_registry_container_config_path: "{{ docker_registry_molecule_seed_config_path }}"

    - name: Ensure the Distribution Registry systemd service is started at the previous major release
      ansible.builtin.systemd_service:
        name: docker-registry.service
        state: started
        daemon_reload: true

    - name: Wait for the Distribution Registry API at the previous major release to answer (up to 300s)
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_registry_url }}/v2/"
      register: docker_registry_molecule_ping_seed
      until: docker_registry_molecule_ping_seed is not failed
      retries: 60
      delay: 5

    - name: Run a round trip against Distribution Registry at the previous major release
      ansible.builtin.command:
        argv:
          - python3
          - /var/tmp/roundtrip-registry.py
          - "{{ docker_registry_molecule_registry_url }}"
          - "{{ docker_registry_molecule_repository }}"
          - "{{ docker_registry_molecule_tag_seeded }}"
      register: docker_registry_molecule_roundtrip_seeded
      changed_when: true

    - name: Record the Distribution Registry round trip at the previous major release
      ansible.builtin.copy:
        dest: "{{ docker_registry_molecule_report_path_seeded }}"
        content: "{{ docker_registry_molecule_roundtrip_seeded.stdout }}"
        mode: "0644"

    - name: Record which Distribution Registry release seeded the storage
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - docker-registry
          - /bin/registry
          - --version
      register: docker_registry_molecule_seed_running_version
      changed_when: false

    - name: Record what the seeding pass ran
      ansible.builtin.copy:
        dest: /root/seed-state.json
        mode: "0644"
        content: |
          {{
            {
              'running_version': docker_registry_molecule_seed_running_version.stdout | trim,
            } | to_nice_json
          }}

    # -----------------------------------------------------------------
    # First pass: the role's own default, which refuses deletion
    # -----------------------------------------------------------------

    - name: Include the Distribution Registry role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"

    # Restarted rather than started, because the seeding pass left an older
    # release running and the unit file has just been rewritten.
    - name: Ensure the Distribution Registry systemd service is restarted
      ansible.builtin.systemd_service:
        name: docker-registry.service
        state: restarted
        daemon_reload: true

    - name: Wait for the Distribution Registry API to answer (up to 300s)
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_registry_url }}/v2/"
      register: docker_registry_molecule_ping
      until: docker_registry_molecule_ping is not failed
      retries: 60
      delay: 5

    - name: Run a round trip against Distribution Registry with deletion disabled
      ansible.builtin.command:
        argv:
          - python3
          - /var/tmp/roundtrip-registry.py
          - "{{ docker_registry_molecule_registry_url }}"
          - "{{ docker_registry_molecule_repository }}"
          - "{{ docker_registry_molecule_tag_delete_disabled }}"
      register: docker_registry_molecule_roundtrip_delete_disabled
      changed_when: true

    - name: Record the Distribution Registry round trip with deletion disabled
      ansible.builtin.copy:
        dest: "{{ docker_registry_molecule_report_path_delete_disabled }}"
        content: "{{ docker_registry_molecule_roundtrip_delete_disabled.stdout }}"
        mode: "0644"

    # -----------------------------------------------------------------
    # Second pass: deletion turned on, to show the knob reaches the process
    # -----------------------------------------------------------------

    # Not public, so the override stays scoped to this include. Only the env
    # file changes, which makes this a test of the role's env file rather than
    # of anything Molecule does directly.
    - name: Include the Distribution Registry role with deletion enabled
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        docker_registry_storage_delete_enabled: true

    # The env file is only read when the container is created, so the running
    # process keeps the old setting until the service is restarted.
    - name: Ensure the Distribution Registry systemd service is restarted with deletion enabled
      ansible.builtin.systemd_service:
        name: docker-registry.service
        state: restarted
        daemon_reload: true

    - name: Wait for the Distribution Registry API to answer again (up to 300s)
      ansible.builtin.uri:
        url: "{{ docker_registry_molecule_registry_url }}/v2/"
      register: docker_registry_molecule_ping_again
      until: docker_registry_molecule_ping_again is not failed
      retries: 60
      delay: 5

    - name: Run a round trip against Distribution Registry with deletion enabled
      ansible.builtin.command:
        argv:
          - python3
          - /var/tmp/roundtrip-registry.py
          - "{{ docker_registry_molecule_registry_url }}"
          - "{{ docker_registry_molecule_repository }}"
          - "{{ docker_registry_molecule_tag_delete_enabled }}"
      register: docker_registry_molecule_roundtrip_delete_enabled
      changed_when: true

    - name: Record the Distribution Registry round trip with deletion enabled
      ansible.builtin.copy:
        dest: "{{ docker_registry_molecule_report_path_delete_enabled }}"
        content: "{{ docker_registry_molecule_roundtrip_delete_enabled.stdout }}"
        mode: "0644"
